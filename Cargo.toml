[package]
name = "tui-tui"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
description = "Terminal games for two, played over a direct peer-to-peer connection"
homepage = "https://github.com/mr-nitesh-poudel/tui-tui"
repository = "https://github.com/mr-nitesh-poudel/tui-tui"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["tui", "chess", "peer-to-peer", "game", "terminal"]
categories = ["games", "command-line-utilities"]
exclude = ["examples/", "tests/", "target/"]

# The crate keeps the dashes; the command people type does not.
[[bin]]
name = "tuitui"
path = "src/main.rs"

# No part of this needs raw memory or FFI, so nothing may reach for unsafe.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
blake3 = "1.8.7"
crossterm = { version = "0.29.0", features = ["osc52"] }
dirs = "7.0.0"
getrandom = "0.3"
iroh = "1.2.0"
pkarr = { version = "8.0.1", default-features = false, features = ["dht"] }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
shakmaty = "0.30.1"
spake2 = { version = "0.4", features = ["getrandom"] }
tokio = { version = "1.53.1", features = ["full"] }

# Arithmetic that wraps is a bug here, not a shortcut: a wrapped screen
# coordinate would quietly draw nonsense rather than fail. Checked in release
# too, where it costs nothing this program will notice.
[profile.release]
overflow-checks = true

# Stretching a code with Argon2 takes seconds unoptimised; tests do it a lot.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
# Nobody debugs the shipped binary from its symbols; it saves 4.5MB.
strip = "symbols"
